# 3DPose — 9x Basler a2A1920-165g5m GigE, 1920x1200, 100 fps
name: 3dpose
# Camera backend module (gui_app/backends/<name>.py). The profile names the
# vendor so porting a rig is a profile edit; "basler" is the only one shipped.
camera_backend: basler
# Video encoder: auto = NVENC when a session is free, else libx264; nvenc, x264
# or raw force one path. auto keeps a driver that lowers the NVENC session cap
# from turning into a failed recording.
encoder: auto
# Sidebar pre-fill for a new session. These are this rig's operator and assay,
# written into every session_metadata.json, so they live here and not in code.
metadata_defaults:
  experimenter: IT
  assay: open_field
frame_width: 1920
frame_height: 1200
frame_rate: 100
calibration_frame_rate: 30   # calibration captures at this rate (no benefit to 100 fps for a slowly-waved board)
quality: 21
encode_parallel: 3           # concurrent NVENC jobs (raw mode) / .h264->mp4 remux jobs (realtime mode)
realtime_encode: true        # GPU H.264 encode during capture (no raw.bin, no post-hoc pass). Set false for the raw fallback.
realtime_kick: true          # default: real-time cross-camera frame kick-out — only frames every camera caught are encoded, so videos come out trigger-aligned with no post-hoc re-encode.
# Driver-side buffers per camera. RAM = n_cameras x this x 2.304 MB (11.6 GiB at
# 9 x 600). Must be at least as deep as kick_max_lag, or the pool empties before
# the coordinator gives up on a laggard and a recoverable lag becomes lost frames.
# Buffer depth is not monotonically good — too deep and the capacity preflight
# refuses to start (9 x 1000 is 20.7 GiB of pool alone). Watch Buffer_Underrun_Count
# after a session; nonzero means the pool ran dry and this is too low.
# (History and the sizing A/B: docs/HISTORY.md, phase 6.)
max_num_buffer: 600

kick_max_lag: 480            # Frames the coordinator waits for a lagging camera before
                             # force-dropping a trigger every other camera caught. Sizes the
                             # NV12 ring (max_lag + queue + 64 buffers/cam, ~2.39 GiB each at
                             # 480). Must not exceed the pool (max_num_buffer). Do NOT lower it
                             # blind (a camera that cannot hold 100 fps rides the cap and
                             # force-drops frames every camera captured) and do NOT raise it to
                             # 1000 (that starves capture outright, 24% loss). A/B on the rig,
                             # never assume. See docs/HISTORY.md for the 240/480 measurements.

# Number of cameras that MUST enumerate before a session starts. Camera names are
# positional by serial-number order, so a camera that fails to enumerate (dead switch
# port, unpowered, still booting) renames every camera after it and silently attaches
# the calibration extrinsics to the wrong physical cameras. When adding cameras, confirm
# the new serials sort AFTER the existing ones (here 41920544-41920549 = cam1-cam6,
# 42017507/42017508/42019425 = cam7-cam9), or every later camera is renamed.
n_cameras: 9

# --- Calibration-only exposure / gain -----------------------------------------
# The ChArUco board needs far more light than the experiment does, especially
# with the room dimmed to keep the wireless optostim receiver from triggering.
# Calibration can AFFORD it. In trigger mode the minimum interval is
# `exposure + 1/AcquisitionFrameRate`, so:
#     100 fps recording  -> period 10.0 ms -> exposure ceiling ~3.5 ms
#      30 fps calibration -> period 33.3 ms -> exposure ceiling ~24.5 ms
# i.e. calibration has ~7x the light budget of a recording, for free.
#
# These apply to the CALIBRATION acquisition only; the .pfs values are restored
# for recording, so a long calibration exposure can never leak into a 100 fps
# session (where it would silently halve the frame rate). The ceiling is
# enforced in code and a too-large value is clamped with a loud log line.
#
# The real limit here is MOTION BLUR, not the ceiling: at 15 ms a board moved
# briskly smears and ChArUco corners stop resolving. Move the board slowly and
# pause at each pose. If it is still too dark, raise calibration_gain_db next
# (each +6 dB doubles signal, and noise with it) -- exposure first, gain second.
# 0 / -1 mean "leave the .pfs value alone".
calibration_exposure_us: 5000      # 5 ms; motion blur, not the ceiling, is the limit at 30 fps
calibration_gain_db: -1            # -1 = keep the .pfs gain (6 dB)

# --- Calibration coverage HUD: when to stop waving the board -----------------
# 1_calibrate.py caps intrinsics at 60 pose-diverse frames per camera and stereo
# at 30 shared frames per pair and discards the rest, so these thresholds need
# ~2x margin over those caps, no more; higher just makes a nine-camera
# calibration take far longer than the data can be used for.
#
# The waving time is dominated by CONNECTIVITY, not by these counts -- the graph
# must be one component, which is what a lower min_edge helps most.
#
# If calibrations start coming out marginal, raise these first and read
# reprojection_error_histogram.png for the evidence. Leave the grid criterion
# alone -- it is cheap and it is the one that actually stops a board being waved
# in a single spot, which yields confident, badly-conditioned intrinsics.
calibration_min_per_cam_shared: 120
# Shared board sightings before a camera PAIR counts as connected. Nine cameras
# need at least eight edges, so this number multiplies through the whole
# exercise; a 9/9 solve has succeeded at 40, so 20 keeps margin. 15 is the next
# step down if waving is still slow; the true floor (what the solve needs for a
# stable relative pose per pair) has not been measured.
calibration_min_edge: 20
calibration_min_grid_cells: 3

pfs_path: "configs/mono8_1920x1200.pfs"
output_dir: "data"
board_config: "configs/boards/charuco_8x8_15mm.yaml"

serial_port: COM3
# Every pin driven as a camera trigger. The ORDER carries no meaning -- all pins
# are written inside one noInterrupts() block, so every camera takes the same
# edge. What matters is that no camera's Line1 sits on a pin that is not listed.
#
# THIS RIG FANS OUT: cameras 7-9 share pins 10 and 12 with existing cameras
# rather than getting their own, so nine cameras still need only six pins.
# Listing a pin with nothing on it is harmless, so this is deliberately a
# superset of what is wired.
#
# WATCH THE CURRENT BUDGET when fanning out. An ATmega2560 output is rated for
# roughly 20 mA, and a camera's opto-isolated Line1 is driven by CURRENT, not
# just voltage -- so three inputs on one pin draw three times as much as one.
# Over budget risks the output driver itself; marginally over shows up as a
# camera that misses triggers intermittently. That failure does NOT look like a
# dropped frame: the camera simply never acquires, so its block IDs stay gapless
# and only frame_sync.check_block_id_rate() catches it, after the recording.
# 0/1 (Serial0) and 53 (the laser, see stim_safe_pins) are refused outright.
trigger_pins: [2, 4, 6, 8, 10, 12]

gige_driver: socket          # socket = user-space transport with reliable packet resends. filter = in-kernel pylon GigE Vision driver: less CPU, but with default resend settings it discards a frame on a lost packet (~23% loss at 6 x 100 fps).

# Optostim pins forced LOW at boot (before the serial handshake) so a powered
# laser driver never sees a floating pin. Pin 53 = laser. Workflow pins are
# added automatically; this list is the floor.
stim_safe_pins: [53]

# Written to AcquisitionFrameRate in trigger mode. It does nothing while
# externally triggered but enforces a minimum interval of exposure + 1/rate,
# which is what caps exposure at ~3.94 ms. Keep it at 165, never 0: the limiter
# also paces each camera's readout across 6.06 ms, and without it every camera
# bursts onto its link at once after the shared trigger and marginal links drop
# 8-15% of frames in transmission (see docs/HISTORY.md).
trigger_rate_limit: 165

# --- Hybrid-CPU thread placement -------------------------------------------
# Pin each grab thread to its own P-core. The Ultra 9 285K is 8 P + 16 E cores,
# and at nine cameras Panopticon runs ~19 busy threads, so Windows places most
# on E-cores and picks differently every launch. A grab thread on an E-core runs
# a few percent slow, which the loop cannot absorb (it retrieves at exactly the
# rate frames arrive) -- that is the rotating laggard. Fixed placement beats
# handing the scheduler the P-set: no migration, better cache locality. Encoders
# are deliberately left unpinned (see pin_encoder_threads in session_config.py).
pin_capture_threads: true

# Leave off. Confining encoders to the P-core set (nine encoders sharing eight
# P-cores with nine pinned grab threads) quadruples the grab threads' copy time
# (0.7 -> 2.8 ms) and does not stop the divergence it targets. Kept as an option
# because the E-core failure mode it addresses is real, but it is not the answer
# here. See docs/HISTORY.md, phase 6.
encoder_pcores: false

# Keep capture threads off CPU 0 and CPU 1, which carry ~46% of NIC DPC time on
# this machine: a grab thread pinned there is descheduled by the traffic it is
# receiving (median/p95/max lag 0/6/12 on CPU 0 vs 0/1/1 excluded, and it
# diverges under GUI load). Leaves 6 cores for 9 cameras, so three float across
# the pool -- a far better trade than parking a camera on the busiest core.
capture_core_exclude: [0, 1]

# Seconds between camera temperature polls while acquiring; 0 disables. These
# cameras have no fan and cool by conduction through the mount, so temperature is
# a property of the installation: four of the nine sit above the vendor's 76 C
# Critical threshold by mounting, which is being addressed with heatsinks, not in
# software. Thresholds are read from each camera, never from this file, and
# temperatures go into session metadata either way. The live status-bar alert is
# the only place an overheating camera can be acted on before it shuts down; the
# post-encoding report only flags heat when the session actually lost frames
# (main_window._on_encoding_done), so a warm-but-clean session does not nag.
thermal_poll_s: 20

# Degrees C below the shutdown temperature each camera reports at which the live
# thermal warning starts. These cameras report 81 C, so 2.0 warns at 79 C.
thermal_warn_margin_c: 2.0
