# 3DPose — 6x Basler a2A1920-165g5m GigE, 1920x1200, 100 fps
name: 3dpose
frame_width: 1920
frame_height: 1200
frame_rate: 100
calibration_frame_rate: 30   # calibration captures at this rate (no benefit to 100 fps for a slowly-waved board)
quality: 21
encode_parallel: 3           # concurrent NVENC jobs (raw mode) / .h264->mp4 remux jobs (realtime mode)
realtime_encode: true        # GPU H.264 encode during capture (no raw.bin, no post-hoc pass). Set false for the raw fallback.
realtime_kick: true          # default: real-time cross-camera frame kick-out — only frames every camera caught are encoded, so videos come out trigger-aligned with no post-hoc re-encode.
# Driver-side buffers per camera. LOWERED 1000 -> 250 on 2026-09-10, forced by the
# move to 9 cameras: at 1000 the pylon pool alone is 9 x 1000 x 2.304 MB = 20.7 GiB,
# and with the NV12 ring on top the capacity preflight refused to start anything on
# a 63.4 GiB machine. 250 is 5.2 GiB and still 2.5 s of slack at 100 fps (8.3 s at
# the 30 fps calibration rate) -- 1000 was 10 s, which is far more jitter than this
# rig has ever shown: Buffer_Underrun_Count has been 0 on every camera since the
# GetArrayZeroCopy fix. Watch that counter after a session; nonzero means the pool
# ran dry and this went too low.
max_num_buffer: 250

kick_max_lag: 240            # Coordinator buffer, in frames. LOWERED 480 -> 240 on
                             # 2026-09-10 (see the note below): the 480 headroom was
                             # already known to be buying nothing, and 9 cameras made
                             # the RAM cost impossible to keep. Ring is
                             # max_lag + 200 + 64 buffers/cam, so this halves it from
                             # 23.1 GiB to 15.7 GiB across 9 cameras.
                             # HISTORY: RAISED 2026-08-11 when one
                             # camera per session drifted to the cap and force-dropped
                             # frames every camera had captured (12.3% loss at 240).
                             # ROOT CAUSE FOUND 2026-09-03: that drift was result.Array's
                             # GIL-held 2.3 MB memcpy in the grab loop, since replaced
                             # with GetArrayZeroCopy. Observed cross-camera lag is now
                             # median 0 / p95 1 / max 2, so this headroom currently buys
                             # nothing -- it could likely drop back to 240, halving the
                             # NV12 ring (max_lag + queue + 64 buffers/cam = 2.39 GiB
                             # each at 480). Deferred pending a rig A/B; do NOT lower it
                             # blind, and do NOT raise it to 1000 -- that starved
                             # capture outright (24% loss, 2026-06-17).

# Number of cameras that MUST enumerate before a session starts. Camera names are
# positional by serial-number order, so a camera that fails to enumerate (dead switch
# port, unpowered, still booting) renames every camera after it and silently attaches
# the calibration extrinsics to the wrong physical cameras.
#
# RAISED 6 -> 9 on 2026-09-10 when the third switch and cameras 7-9 were installed.
# The new serials (42017507, 42017508, 42019425) sort AFTER the original six
# (41920544-41920549), so cam1-cam6 keep the identities their old calibrations were
# solved against and the new cameras become cam7/cam8/cam9.
n_cameras: 9

# --- Calibration-only exposure / gain -----------------------------------------
# The ChArUco board needs far more light than the experiment does, especially
# with the room dimmed to keep the wireless optostim receiver from triggering.
# Calibration can AFFORD it. In trigger mode the minimum interval is
# `exposure + 1/AcquisitionFrameRate`, so:
#     100 fps recording  -> period 10.0 ms -> exposure ceiling ~3.5 ms
#      30 fps calibration -> period 33.3 ms -> exposure ceiling ~24.5 ms
# i.e. calibration has ~7x the light budget of a recording, for free.
#
# These apply to the CALIBRATION acquisition only; the .pfs values are restored
# for recording, so a long calibration exposure can never leak into a 100 fps
# session (where it would silently halve the frame rate). The ceiling is
# enforced in code and a too-large value is clamped with a loud log line.
#
# The real limit here is MOTION BLUR, not the ceiling: at 15 ms a board moved
# briskly smears and ChArUco corners stop resolving. Move the board slowly and
# pause at each pose. If it is still too dark, raise calibration_gain_db next
# (each +6 dB doubles signal, and noise with it) -- exposure first, gain second.
# 0 / -1 mean "leave the .pfs value alone".
calibration_exposure_us: 15000     # 15 ms = 5x the 3 ms recording exposure
calibration_gain_db: -1            # -1 = keep the .pfs gain (6 dB)

pfs_path: "configs/mono8_1920x1200.pfs"
output_dir: "data"
board_config: "configs/boards/charuco_8x8_15mm.yaml"

serial_port: COM3
# Every pin driven as a camera trigger. The ORDER carries no meaning -- all pins
# are written inside one noInterrupts() block, so every camera takes the same
# edge. What matters is that no camera's Line1 sits on a pin that is not listed.
#
# THIS RIG FANS OUT, so the list did NOT grow when the count went 6 -> 9
# (2026-09-10): cameras 7-9 share pins 10 and 12 with existing cameras rather
# than getting their own. Listing a pin with nothing on it is harmless, so this
# is deliberately a superset of what is wired.
#
# WATCH THE CURRENT BUDGET when fanning out. An ATmega2560 output is rated for
# roughly 20 mA, and a camera's opto-isolated Line1 is driven by CURRENT, not
# just voltage -- so three inputs on one pin draw three times as much as one.
# Over budget risks the output driver itself; marginally over shows up as a
# camera that misses triggers intermittently. That failure does NOT look like a
# dropped frame: the camera simply never acquires, so its block IDs stay gapless
# and only frame_sync.check_block_id_rate() catches it, after the recording.
# 0/1 (Serial0) and 53 (the laser, see stim_safe_pins) are refused outright.
trigger_pins: [2, 4, 6, 8, 10, 12]

gige_driver: socket          # socket = user-space w/ reliable packet resends (proven). filter = in-kernel pylon GigE Vision driver: less CPU but silently dropped ~23% of frames w/ default resend settings (2026-06-12)

# Optostim pins forced LOW at boot (before the serial handshake) so a powered
# laser driver never sees a floating pin. Pin 53 = laser. Workflow pins are
# added automatically; this list is the floor.
stim_safe_pins: [53]

# Disable the camera's internal rate generator in trigger mode. It does nothing while
# externally triggered but enforces a minimum interval of exposure + 1/rate, which is what
# capped exposure at ~3.94 ms. 0 = disabled; 3dface stays on 165 until tested there.
trigger_rate_limit: 165      # REVERTED 2026-08-11: setting this to 0 (limiter off) cost
                             # 8-15% of frames IN TRANSMISSION. Cameras still acquired every
                             # trigger (rate 100.03, block IDs contiguous) but delivery
                             # dropped to 85-92% vs 99.98% with the limiter on. The limiter
                             # paces readout over 6.06 ms; without it six cameras burst
                             # together after each trigger and the marginal links lose
                             # packets. Worst on cams 1/4/6. Do not disable this again
                             # without fixing the network margin first.
