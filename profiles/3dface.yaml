# 3DFace — 6x Basler acA1300-200um USB3, 1280x1024, 100 fps
name: 3dface
frame_width: 1280
frame_height: 1024
frame_rate: 100
calibration_frame_rate: 30
quality: 21
encode_parallel: 3
realtime_encode: true
realtime_kick: true
kick_max_lag: 240

pfs_path: "configs/mono8_mono.pfs"
output_dir: "data"
board_config: "configs/boards/charuco_5x5_3dface.yaml"

serial_port: COM3
trigger_pins: [2, 4, 6, 8, 10, 12]

# No optostim hardware on this rig. Add the laser/LED pin here if that changes —
# listed pins are driven LOW from boot so the driver never sees a floating pin.
stim_safe_pins: []

# --- Calibration coverage HUD -----------------------------------------------
# PINNED EXPLICITLY 2026-09-11. These were 250/80 by code default; on 2026-09-10
# the defaults moved to 120/40 for the 9-camera 3dpose rig and this profile
# would have inherited the change silently, lowering its bar with no
# measurement on this rig's cameras, optics or lighting. Keep the old values
# until someone actually validates lower ones here.
calibration_min_per_cam_shared: 250
calibration_min_edge: 80
calibration_min_grid_cells: 3

# 3dface has not been characterised for hybrid-CPU thread placement; leave off.
pin_capture_threads: false

# Pinned explicitly rather than inherited: 3dface's cameras and mounts are not
# the 3dpose rig's, so its thermal behaviour is uncharacterised. The poll is
# cheap and the thresholds come from the cameras themselves, so leave it on.
thermal_poll_s: 20.0
